services:
  antigravity:
    image: jklinker/antigravity:slim
    container_name: antigravity
    restart: unless-stopped
    ports:
      - "4400:4400"
    environment:
      - PUID=1000
      - PGID=1000
      - RC_NAME=server-agent
      - AGY_PORT=4400
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - BLOCK_TELEMETRY=true
    volumes:
      - ./workspace:/workspace
      - ./data/gemini:/home/developer/.gemini
      - ./data/ssh:/home/developer/.ssh
      - ./data/gitconfig:/home/developer/.gitconfig
