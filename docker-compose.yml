services:
  antigravity:
    image: ghcr.io/tamdinh/antigravity-docker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: antigravity
    restart: unless-stopped
    ports:
      - "4400:4400"
    environment:
      - PUID=1000
      - PGID=1000
      - RC_NAME=server-agent
      - AGY_PORT=4400
      - AUTH_PASSWORD=${AUTH_PASSWORD:-}
      - TRUST_PROXY=${TRUST_PROXY:-true}
      - BLOCK_TELEMETRY=true
      - ENABLE_IDE=true
      - ENABLE_TERMINAL=true
      - TERMINAL_MODE=${TERMINAL_MODE:-auto}
      - HOST_SSH_USER=${HOST_SSH_USER:-}
      - HOST_SSH_HOST=${HOST_SSH_HOST:-host.docker.internal}
      - HOST_SSH_PORT=${HOST_SSH_PORT:-22}
      - HOST_SSH_DIR=${HOST_SSH_DIR:-}
      - GIT_USER_NAME=${GIT_USER_NAME:-}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - antigravity-workspace:/workspace
      - antigravity-gemini:/home/developer/.gemini
      - antigravity-ssh:/home/developer/.ssh

volumes:
  antigravity-workspace:
  antigravity-gemini:
  antigravity-ssh:
